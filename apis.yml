apis:
- aid: kyverno:kyverno
  name: Kyverno
  description: >-
    Kyverno is a Kubernetes-native policy engine that runs as a dynamic admission controller to validate,
    mutate, and generate Kubernetes resources using policies written as Kubernetes resources. It supports
    policy types across multiple API groups including kyverno.io, policies.kyverno.io, and policyreport.io,
    covering validation, mutation, generation, cleanup, and image verification use cases.
  humanURL: https://kyverno.io/
  tags:
  - Kubernetes
  - Policy
  - Security
  properties:
  - type: Documentation
    url: https://kyverno.io/docs/introduction/
  - type: GettingStarted
    url: https://kyverno.io/docs/installation/
  - type: Reference
    url: https://kyverno.io/docs/policy-types/
  - type: ChangeLog
    url: https://kyverno.io/docs/releases/
  - type: GitHubRepository
    url: https://github.com/kyverno/kyverno
- aid: kyverno:kyverno-cli
  name: Kyverno CLI
  description: >-
    The Kyverno CLI provides a command-line interface for applying and testing Kyverno policies against
    Kubernetes resources outside of a cluster. It can be used in CI/CD pipelines to validate resources
    before deployment, run policy tests, and interact with JMESPath expressions used in policy rules.
  humanURL: https://kyverno.io/docs/kyverno-cli/
  tags:
  - CLI
  - Developer Tools
  - Kubernetes
  - Policy
